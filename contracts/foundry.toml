[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1024
max_test_rejects = 100000

[profile.deep]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.deep.fuzz]
runs = 50000
max_test_rejects = 1000000

[fmt]
line_length = 100
tab_width = 4

# Fork tests read the live Chainlink equity aggregators on mainnet 4663. Those
# contracts were compiled for Shanghai and use PUSH0, which is not activated
# under paris: revm reports NotActivated, burns the whole gas limit, and every
# fork test fails with a bare Revert. Shanghai is set here rather than in the
# default profile because changing evm_version there would alter the bytecode of
# every deployed contract and of all 232 existing tests.
#
#   forge test --profile fork --match-contract ChainlinkRoundsFork -vv
#
# Excluded from the default profile because a full run takes over two minutes.
[profile.fork]
src = "src"
out = "out-fork"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
rh_testnet = "${RH_TESTNET_RPC}"
rh_mainnet = "${RH_MAINNET_RPC}"
polygon    = "${POLYGON_RPC}"
